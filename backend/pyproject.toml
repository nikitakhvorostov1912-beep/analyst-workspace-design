[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analyst-backend"
# 2026-05-24 (FINDING-00 финальное закрытие): синхронизировано с desktop/package.json,
# frontend/lib/version.ts и backend/app/config.py:app_version. Все 4 точки версии
# обновляются вместе при релизе. См. .planning/RELEASE_v1.4.5_CHECKLIST.md.
version = "1.4.5"
description = "1С Аналитик — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",  # W1.4: rate-limit на /chat endpoint
    "sqlparse>=0.5",  # P2.3: SQL AST validator (defence-in-depth поверх keyword scan)
    "cryptography>=43",  # P2.1: AES-GCM для user_secrets — backend-only API key storage
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "httpx>=0.27",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app/orchestrator --cov=app/clients --cov-fail-under=80 --cov-report=term-missing -ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/storage/db.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 1

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
# Объединяем aliased импорты в один from-блок с обычными импортами того же
# модуля. Без этого `from foo import bar` и `from foo import baz as alias`
# разделяются в 2 блока — некрасиво, шумит в diff и не даёт I001 чисто
# зелёным даже после `--fix`.
combine-as-imports = true
